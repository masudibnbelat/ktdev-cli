    <text x="76" y="408" fill="#d4d4d4">== APK: /home/professor/MyApp/apk/MyApp-debug.apk</text>
    <text x="76" y="468" fill="#ffffff"><tspan font-weight="bold">$ </tspan>ktdev devices</text>
