    <text x="76" y="528" fill="#a3a3a3">List of devices attached</text>
    <text x="76" y="558" fill="#a3a3a3">bb0758c3  device</text>
    <text x="76" y="598" fill="#ffffff" font-weight="bold">$</text>
    <rect x="92" y="582" width="11" height="21" fill="#ffffff"/>
