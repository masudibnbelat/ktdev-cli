    <text x="76" y="228" fill="#a3a3a3">Project: /home/professor/MyApp</text>
    <text x="76" y="258" fill="#a3a3a3">Wrapper Gradle version: 8.9</text>
    <text x="76" y="318" fill="#ffffff"><tspan font-weight="bold">$ </tspan>ktdev build</text>
    <text x="76" y="348" fill="#d4d4d4">== Java not found — downloading Eclipse Temurin 17 once...</text>
